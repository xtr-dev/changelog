name: 'xtr-changelog'
description: 'Conventional-commits-driven release: bump version, update changelog, commit, tag, push.'
author: 'xtr-dev'
branding:
  icon: 'tag'
  color: 'purple'

inputs:
  node-version:
    description: 'Node.js version to use.'
    required: false
    default: '22'
  cwd:
    description: 'Working directory.'
    required: false
    default: '.'
  package-version:
    description: >-
      Version of @xtr-dev/changelog to install. Empty (the default) installs the
      version matching this action's ref; "local" uses the workspace install.
    required: false
    default: ''
  commit:
    description: 'Create a release commit (true/false).'
    required: false
    default: 'true'
  tag:
    description: 'Create an annotated git tag (true/false).'
    required: false
    default: 'true'
  push:
    description: 'Push the commit and tag (true/false).'
    required: false
    default: 'true'
  remote:
    description: 'Remote to push to.'
    required: false
    default: 'origin'
  branch:
    description: 'Branch to push (default: current).'
    required: false
    default: ''
  message:
    description: 'Commit message template. {version} is substituted.'
    required: false
    default: 'chore(release): v{version} [skip ci]'
  preid:
    description: 'Cut a pre-release with this identifier (e.g. beta → 1.3.0-beta.0).'
    required: false
    default: ''
  release-as:
    description: 'Release exactly this version (e.g. 1.0.0).'
    required: false
    default: ''
  github-release:
    description: 'Create a GitHub Release for the new tag, with the changelog entry as notes (true/false). Needs tag and push.'
    required: false
    default: 'false'
  github-token:
    description: 'Token used to create the GitHub Release. Needs contents: write.'
    required: false
    default: ${{ github.token }}
  git-user-name:
    description: 'Git committer name.'
    required: false
    default: 'github-actions[bot]'
  git-user-email:
    description: 'Git committer email.'
    required: false
    default: '41898282+github-actions[bot]@users.noreply.github.com'

outputs:
  released:
    description: '"true" if a release was cut, otherwise "false".'
    value: ${{ steps.run.outputs.released }}
  version:
    description: 'The new version (or previous version if no release).'
    value: ${{ steps.run.outputs.version }}
  previous-version:
    description: 'The previous version.'
    value: ${{ steps.run.outputs.previous-version }}
  tag:
    description: 'The tag created, or empty string if none.'
    value: ${{ steps.run.outputs.tag }}
  changes-json:
    description: 'The new entry as JSON, or empty string if no release.'
    value: ${{ steps.run.outputs.changes-json }}
  release-url:
    description: 'URL of the GitHub Release, if one was created.'
    value: ${{ steps.github-release.outputs.url }}

# Every input reaches the scripts through env, never by ${{ }} interpolation
# into the script text: an input containing a quote or $(...) must stay data.
runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Configure git
      shell: bash
      working-directory: ${{ inputs.cwd }}
      env:
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        git config user.name "$GIT_USER_NAME"
        git config user.email "$GIT_USER_EMAIL"

    - name: Install xtr-changelog
      shell: bash
      env:
        PACKAGE_VERSION: ${{ inputs.package-version }}
      run: |
        set -euo pipefail
        if [ "$PACKAGE_VERSION" = "local" ]; then
          echo "Using local install."
          exit 0
        fi
        if [ -z "$PACKAGE_VERSION" ]; then
          PACKAGE_VERSION=$(node -p "require(process.argv[1]).version" "$GITHUB_ACTION_PATH/package.json")
        fi
        npm i -g "@xtr-dev/changelog@$PACKAGE_VERSION"

    - name: Run release
      id: run
      shell: bash
      working-directory: ${{ inputs.cwd }}
      env:
        PACKAGE_VERSION: ${{ inputs.package-version }}
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_PUSH: ${{ inputs.push }}
        INPUT_REMOTE: ${{ inputs.remote }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_MESSAGE: ${{ inputs.message }}
        INPUT_PREID: ${{ inputs.preid }}
        INPUT_RELEASE_AS: ${{ inputs.release-as }}
      run: |
        set -euo pipefail
        if [ "$PACKAGE_VERSION" = "local" ]; then
          CLI=(npx --no-install xtr-changelog)
        else
          CLI=(xtr-changelog)
        fi

        ARGS=(release --execute --json --remote "$INPUT_REMOTE" --message "$INPUT_MESSAGE")
        if [ "$INPUT_COMMIT" = "true" ]; then ARGS+=(--commit); fi
        if [ "$INPUT_TAG" = "true" ]; then ARGS+=(--tag); fi
        if [ "$INPUT_PUSH" = "true" ]; then ARGS+=(--push); fi
        if [ -n "$INPUT_BRANCH" ]; then ARGS+=(--branch "$INPUT_BRANCH"); fi
        if [ -n "$INPUT_PREID" ]; then ARGS+=(--preid "$INPUT_PREID"); fi
        if [ -n "$INPUT_RELEASE_AS" ]; then ARGS+=(--release-as "$INPUT_RELEASE_AS"); fi

        OUT=$("${CLI[@]}" "${ARGS[@]}")
        echo "$OUT"

        RESULT="$OUT" node -e '
          const fs = require("node:fs")
          const crypto = require("node:crypto")
          const j = JSON.parse(process.env.RESULT)
          const eof = "EOF_" + crypto.randomBytes(8).toString("hex")
          const lines = [
            `released=${j.released ? "true" : "false"}`,
            `version=${j.version || ""}`,
            `previous-version=${j.previousVersion || ""}`,
            `tag=${(j.git && j.git.tag) || ""}`,
            `changes-json<<${eof}`,
            j.entry ? JSON.stringify(j.entry) : "",
            eof,
          ]
          fs.appendFileSync(process.env.GITHUB_OUTPUT, lines.join("\n") + "\n")
        '

    - name: Create GitHub Release
      id: github-release
      if: inputs.github-release == 'true' && steps.run.outputs.released == 'true'
      shell: bash
      working-directory: ${{ inputs.cwd }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
        PACKAGE_VERSION: ${{ inputs.package-version }}
        INPUT_PUSH: ${{ inputs.push }}
        TAG: ${{ steps.run.outputs.tag }}
        VERSION: ${{ steps.run.outputs.version }}
      run: |
        set -euo pipefail
        if [ -z "$TAG" ] || [ "$INPUT_PUSH" != "true" ]; then
          echo "::warning::github-release needs tag: true and push: true; skipping."
          exit 0
        fi
        if [ "$PACKAGE_VERSION" = "local" ]; then
          CLI=(npx --no-install xtr-changelog)
        else
          CLI=(xtr-changelog)
        fi
        NOTES="$RUNNER_TEMP/xtr-changelog-notes.md"
        "${CLI[@]}" notes "$VERSION" > "$NOTES"
        FLAGS=()
        case "$VERSION" in *-*) FLAGS+=(--prerelease) ;; esac
        URL=$(gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$NOTES" "${FLAGS[@]}")
        echo "url=$URL" >> "$GITHUB_OUTPUT"
